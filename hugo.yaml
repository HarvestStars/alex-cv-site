  # Projects
  projects:
    enable: true
    categories:
      - title: "AI for Financial Time Series"
        description: ""
        items:
          - title: Chronos2 Crypto Forecasting
            content: Fine-tuning and applying Chronos2, a time-series foundation model, to cryptocurrency price forecasting. The project explores probabilistic multi-horizon prediction on volatile crypto data, with the BTC chart shown here as an illustrative output that changes with training mode, data window, and evaluation setup.
            image: /images/projects/btc_predict.jpg
            badges:
              - "Chronos2"
              - "TSFM"
              - "Quantile Forecasting"
            links:
              - icon: fab fa-github
                url: https://github.com/GeekChomolungma/Crypto_Forecast

          - title: Risk-Calibrated Crypto Signal Framework
            content: Master's thesis project that extends the forecasting pipeline into a trading-signal and backtesting framework. It combines custom loss design for quantile prediction with Hawkes-process market risk modeling, then uses risk-adjusted expected return as a timing signal. The full thesis is linked in the Articles section below.
            image: /images/projects/btc_equity_01.png
            badges:
              - "Custom Loss"
              - "Hawkes Process"
              - "Backtesting"

      - title: "Crypto Trading Infrastructure"
        description: ""
        items:
          - title: ChomoSyncer
            content: A high-performance Binance market data synchronizer that streams multi-symbol cryptocurrency Kline data in real time, distributes updates through Redis Streams, and persists historical data into MongoDB for research, backtesting, and downstream trading systems.
            image: /images/projects/chomoSyncworkflow.jpg
            badges:
              - "C++"
              - "Redis/MongoDB"
              - "Binance API"
            links:
              - icon: fab fa-github
                url: https://github.com/GeekChomolungma/ChomoSyncer

          - title: Binance Orderbook Visualizer
            content: A real-time 3D visualization app for Binance order books, using streaming depth data to reveal market microstructure, liquidity shifts, best bid/ask trajectories, and transient order-book imbalances.
            image: /images/projects/binance-orderbook-demo.gif
            badges:
              - "Python"
              - "Binance"
              - "WebSocket"

            links:
              - icon: fab fa-github
                url: https://github.com/GeekChomolungma/Binance-Orderbook

          - title: Kline Preprocess
            content: A cryptocurrency K-line preprocessing pipeline that standardizes Binance OHLCV data and generates no-lookahead technical indicator features for downstream consumers such as traditional price-volume models and time-series AI foundation models.
            image: /images/projects/kline.jpg
            badges:
              - "OHLCV"
              - "TA"

            links:
